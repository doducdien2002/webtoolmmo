services:
  - type: web
    name: toolstore-mmo
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_STORAGE_BUCKET
        value: foodapp2023-470a6.appspot.com
      - key: APP_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
