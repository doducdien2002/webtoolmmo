<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHỢ TOOL – Kho Tool &amp; Source Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Be+Vietnam+Pro:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Scroll reveal: mọi phần tử có class "reveal" sẽ mờ dần + trượt nhẹ
      vào khi cuộn tới. Không cần import gì trong React — chỉ cần thêm
      className="reveal" (hoặc "reveal reveal-left", "reveal-scale"...)
      vào JSX là script này tự nhận diện và chạy.

      Vì trang là SPA (React), nội dung được render động sau khi
      main.jsx chạy, nên script dùng MutationObserver để tự quét lại
      mỗi khi có phần tử mới xuất hiện trong DOM (đổi trang, load
      thêm sản phẩm...).
    -->
    <script>
      (function () {
        function initScrollReveal() {
          if (window.__scrollRevealInited) return;
          window.__scrollRevealInited = true;

          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
          );

          function observeAll() {
            document.querySelectorAll('.reveal:not(.is-visible)').forEach(function (el) {
              observer.observe(el);
            });
          }

          observeAll();

          var mutationObserver = new MutationObserver(function () {
            observeAll();
          });
          mutationObserver.observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initScrollReveal);
        } else {
          initScrollReveal();
        }
      })();
    </script>
  </body>
</html>
